#!/usr/sbin/nft -f
# Servidor de comunicacions Debian 13 - Joan Brotons (posicio 11)
# WAN: enp0s3 (pont, DHCP 172.16.222.0/24)  LAN: enp0s8 (192.168.11.3/24, redjoan11)
flush ruleset

define WAN = "enp0s3"
define LAN = "enp0s8"
define LAN_NET = 192.168.11.0/24
define AULA_NET = 172.16.222.0/24

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;
        ct state established,related accept
        ct state invalid drop
        iif "lo" accept
        ip protocol icmp accept
        iifname $LAN ip saddr $LAN_NET accept comment "Gestio i serveis (DNS, SSH) des de la LAN"
        iifname $WAN ip saddr $AULA_NET tcp dport 22 accept comment "SSH de gestio des de la xarxa de l'aula"
        limit rate 10/minute log prefix "DEB-IN-DROP " level info
    }
    chain forward {
        type filter hook forward priority filter; policy drop;
        ct state established,related accept
        ct state invalid drop
        iifname $LAN tcp dport 23 log prefix "DEB-BLOQ-TELNET " level info drop comment "PROVA: connexio bloquejada"
        iifname $LAN oifname $WAN ip saddr $LAN_NET accept comment "LAN -> Internet"
        limit rate 10/minute log prefix "DEB-FWD-DROP " level info
    }
    chain output {
        type filter hook output priority filter; policy accept;
    }
}

table ip nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        oifname $WAN ip saddr $LAN_NET masquerade
    }
}
